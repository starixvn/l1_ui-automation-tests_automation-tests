variables:
  GIT_CLEAN_FLAGS: none
  ALLURE_URL: "http://10.10.50.160:8080/api/result"
  HEADER: "Content-Type: multipart/form-data;accept: */*"

stages:
  - test
  - notify

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm
  - rm -rf allure-results
  - rm -rf test-results
  - rm -f allure-results.zip
  - npx playwright install

e2etest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:e2e --env=$ENV --gameid=$GAMEID --project=$STACK_NAME --jackpot=$jackpot

  retry: 2
  rules:
    - if: $MODE == "E2E"
      when: always
    - when: never

  artifacts:
    paths:
      - tests/playwright-report
      - tests/test-results
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

gameguidetest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - auto-test-prod
  script:
    - rm -r *
    - cp -r /app/* ./
    - npm run test:guide --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - du -hs /ms-playwright/*
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "GUIDE"
      when: always
    - when: never

  artifacts:
    paths:
      - tests/playwright-report
      - tests/test-results
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

e2etestmac:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:e2e --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - echo "$CI_JOB_ID"
    - npm run sendresult --env=$ENV --gameid=$GAMEID --pipelineid=$CI_JOB_ID
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "E2E1"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

smoketest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:smoke --env=$ENV --gameid=$GAMEID --project=$STACK_NAME --trackDownload=$PERFORMANCE --odds==$QUICKBET
  after_script:
    - if [ "$UPLOAD_ALLURE_RP" = "true" ]; then
      zip -r allure-results.zip allure-results &&
      curl -X POST "${ALLURE_URL}" -H "${HEADER}" -F 'allureResults=@allure-results.zip;type=application/x-zip-compressed';
      fi

  retry: 2
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKE"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

smoketestOther:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:smoke:$MODE --env=$ENV --gameid=$GAMEID --project=$STACK_NAME --trackDownload=$PERFORMANCE --mobile=$MOBILE
  after_script:
    - if [ "$UPLOAD_ALLURE_RP" = "true" ]; then
      zip -r allure-results.zip allure-results &&
      curl -X POST "${ALLURE_URL}" -H "${HEADER}" -F 'allureResults=@allure-results.zip;type=application/x-zip-compressed';
      fi
  retry: 2
  rules:
    - if: $TRIGGER == "true" && $MODE != "SMOKE" &&  $MODE != "E2E" &&  $TEST != "ALLURE"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

generate-allure-report:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-0
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run allure
  retry: 0
  rules:
    - if: $TRIGGER == "true" && $TEST == "ALLURE"
    - when: never

notify-smoketest-failure:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-0
  stage: notify
  before_script: []
  tags:
    - e2e-test
  needs:
    - job: smoketest
      artifacts: true
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKE"
      when: on_failure
    - when: never
  script:
    - |
      node ci/format-smoke-failure.js "$JSON_PATH" > message.txt || true
      MESSAGE=$(cat message.txt)
      echo "Using message: $MESSAGE"
      echo "$MESSAGE"
      if [ -z "$SKYNEX_BASE_URL" ] || [ -z "$SKYNEX_TOKEN" ] || [ -z "$SKYNEX_CONVERSATION_ID" ]; then
        echo "Skynex variables are missing; skipping notification."
        exit 0
      fi
      ENCODED_MESSAGE=$(node -e "console.log(encodeURIComponent(process.argv.slice(1).join(' ')))" "$MESSAGE")
      ENCODED_TOKEN=$(node -e "console.log(encodeURIComponent(process.argv[1]||''))" "$SKYNEX_TOKEN")
      ENCODED_CONV=$(node -e "console.log(encodeURIComponent(process.argv[1]||''))" "$SKYNEX_CONVERSATION_ID")
      TARGET_URL="${SKYNEX_BASE_URL}?token=${ENCODED_TOKEN}&message=${ENCODED_MESSAGE}&conversationId=${ENCODED_CONV}"
      echo "Calling Skynex: $TARGET_URL"
      curl -X POST "$TARGET_URL"

notify-smoketestOther-failure:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-0
  stage: notify
  before_script: []
  tags:
    - e2e-test
  needs:
    - job: smoketestOther
      artifacts: true
  rules:
    - if: $TRIGGER == "true" && $MODE != "SMOKE" && $MODE != "E2E" && $TEST != "ALLURE"
      when: on_failure
    - when: never
  script:
    - |
      node ci/format-smoke-failure.js "$JSON_PATH" > message.txt || true
      MESSAGE=$(cat message.txt)
      echo "Using message: $MESSAGE"
      echo "$MESSAGE"
      if [ -z "$SKYNEX_BASE_URL" ] || [ -z "$SKYNEX_TOKEN" ] || [ -z "$SKYNEX_CONVERSATION_ID" ]; then
        echo "Skynex variables are missing; skipping notification."
        exit 0
      fi
      ENCODED_MESSAGE=$(node -e "console.log(encodeURIComponent(process.argv.slice(1).join(' ')))" "$MESSAGE")
      ENCODED_TOKEN=$(node -e "console.log(encodeURIComponent(process.argv[1]||''))" "$SKYNEX_TOKEN")
      ENCODED_CONV=$(node -e "console.log(encodeURIComponent(process.argv[1]||''))" "$SKYNEX_CONVERSATION_ID")
      TARGET_URL="${SKYNEX_BASE_URL}?token=${ENCODED_TOKEN}&message=${ENCODED_MESSAGE}&conversationId=${ENCODED_CONV}"
      echo "Calling Skynex: $TARGET_URL"
      curl -X POST "$TARGET_URL"
