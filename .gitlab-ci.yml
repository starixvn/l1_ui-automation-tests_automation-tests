  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:e2e --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - echo "$CI_JOB_ID"
    - npm run sendresult --env=$ENV --gameid=$GAMEID --pipelineid=$CI_JOB_ID
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "E2E1"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results
    when: always
    expire_in: 1 day

smoketest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:smoke --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - sleep 5
    - |
      if [ -f "test-results/Warning.txt" ]; then
        echo "Warning found"
        # Set the job status to 'warning'
        export WARNING=true
      else
        echo "No Warning"
        export WARNING=false
      fi
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKE"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results
    when: always
    expire_in: 1 day

smoketestxd:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - curl -X GET "http://10.70.70.120:8080/api/result/72d84060-8dac-4e79-a09f-f941290f471c"
    - npm run test:smoke:xd --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - brew update
    - brew install zip curl
    - zip -r allure-results.zip allure-results
    - if [ -f "allure-results.zip" ]; then echo "allure-results.zip exists" > zip_exists.log; fi
    - curl -X POST "${ALLURE_URL}" -H "${HEADER}" -F 'allureReportArchive=@allure-results.zip;type=application/x-zip-compressed'

  retry: 0
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKEXD"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results
      - allure-results
      - allure-results.zip
    when: always
    expire_in: 1 day

